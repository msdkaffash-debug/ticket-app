
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ثبت نام</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Tahoma, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
    background: linear-gradient(135deg,#ff8fab,#c8a2ff,#8bd3ff,#8debc5);
    background-size: 300% 300%;
    animation: gradient 12s ease infinite;
}

@keyframes gradient {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.circle {
    position: fixed;
    border-radius: 50%;
    opacity: .3;
    pointer-events: none;
}

.one {
    width: 180px;
    height: 180px;
    background: white;
    top: -60px;
    right: -40px;
}

.two {
    width: 150px;
    height: 150px;
    background: #fff36b;
    bottom: -50px;
    left: -40px;
}

.container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 470px;
    padding: 23px 27px;
    border-radius: 24px;
    background: white;
    text-align: center;
    box-shadow: 0 18px 55px rgba(83,45,130,.2);
}

.logo {
    width: 57px;
    height: 57px;
    margin: 0 auto 9px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 19px;
    font-size: 29px;
    background: linear-gradient(135deg,#ff80ab,#a78bfa);
    box-shadow: 0 7px 18px rgba(167,139,250,.3);
}

h1 {
    font-size: 21px;
    color: #39275f;
    margin-bottom: 6px;
}

.subtitle {
    font-size: 11px;
    color: #9990b1;
    margin-bottom: 19px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 13px;
    text-align: right;
}

.form-group {
    min-width: 0;
}

/* فیلدهای اصلی تمام عرض */
.form-group:nth-child(-n+5) {
    grid-column: 1 / -1;
}

/* دو فیلد رمز عبور کنار هم */
.form-group:nth-child(n+6) {
    grid-column: span 1;
}

label {
    display: block;
    font-size: 11px;
    font-weight: bold;
    color: #554875;
    margin-bottom: 6px;
}

.input-box {
    position: relative;
}

.input-box input {
    width: 100%;
    height: 39px;
    padding: 0 35px 0 9px;
    border: 1.5px solid #f0ecfa;
    border-radius: 11px;
    background: #faf9ff;
    color: #45366b;
    font-family: Tahoma,sans-serif;
    font-size: 11px;
    direction: rtl;
    outline: none;
    transition: .25s;
}

.input-box input:focus {
    background: white;
    border-color: #a78bfa;
    box-shadow: 0 0 0 3px rgba(167,139,250,.12);
}

.input-box input::placeholder {
    color: #b9b1cb;
}

.input-icon {
    position: absolute;
    right: 11px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    pointer-events: none;
}

.signup-btn {
    width: 100%;
    height: 43px;
    margin-top: 17px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(100deg,#ff75a0,#a178f5);
    color: white;
    font-family: Tahoma,sans-serif;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(177,116,226,.3);
    transition: .3s;
}

.signup-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 22px rgba(177,116,226,.4);
}

.footer {
    margin-top: 13px;
    font-size: 10px;
    color: #aaa2bd;
}

.footer span {
    color: #ff75a0;
}

/* موبایل */

@media(max-width: 420px) {
    .container {
        padding: 22px 17px;
    }

    .form-grid {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .input-box input {
        height: 42px;
    }
}

/* نمایشگرهای کوتاه */

@media(max-height: 650px) and (min-width: 421px) {
    body {
        padding: 6px;
    }

    .container {
        padding: 13px 22px;
    }

    .logo {
        width: 43px;
        height: 43px;
        font-size: 23px;
        margin-bottom: 5px;
    }

    h1 {
        font-size: 18px;
        margin-bottom: 3px;
    }

    .subtitle {
        margin-bottom: 10px;
    }

    .form-grid {
        gap: 7px 11px;
    }

    .input-box input {
        height: 34px;
    }

    .signup-btn {
        height: 38px;
        margin-top: 10px;
    }

    .footer {
        margin-top: 7px;
    }
}

@media(prefers-reduced-motion:reduce) {
    *,*::before,*::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="circle one"></div>
<div class="circle two"></div>

<div class="container">

    <div class="logo">🌈</div>

    <h1>ثبت نام در سامانه ✨</h1>

    <p class="subtitle">
        اطلاعات خود را برای ایجاد حساب کاربری وارد کنید
    </p>

    <form action="/signup_check" method="post">

        <div class="form-grid">

            <div class="form-group">
                <label for="pname">نام و نام خانوادگی</label>
                <div class="input-box">
                    <span class="input-icon">👤</span>
                    <input type="text" name="pname" id="pname"
                    placeholder="نام و نام خانوادگی"
                    autocomplete="name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="ptel">شماره تلفن</label>
                <div class="input-box">
                    <span class="input-icon">📱</span>
                    <input type="tel" name="ptel" id="ptel"
                    placeholder="شماره تلفن"
                    autocomplete="tel" required>
                </div>
            </div>

            <div class="form-group">
                <label for="pemail">آدرس ایمیل</label>
                <div class="input-box">
                    <span class="input-icon">💌</span>
                    <input type="email" name="pemail" id="pemail"
                    placeholder="ایمیل"
                    autocomplete="email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="pusername">نام کاربری</label>
                <div class="input-box">
                    <span class="input-icon">🪪</span>
                    <input type="text" name="pusername" id="pusername"
                    placeholder="نام کاربری"
                    autocomplete="username" required>
                </div>
            </div>

            <div class="form-group">
                <label for="prole">نقش</label>
                <div class="input-box">
                    <span class="input-icon">🎭</span>
                    <input type="text" name="prole" id="prole"
                    placeholder="نقش"
                    required>
                </div>
            </div>

            <div class="form-group">
                <label for="ppass">رمز عبور</label>
                <div class="input-box">
                    <span class="input-icon">🔐</span>
                    <input type="password" name="ppass" id="ppass"
                    placeholder="رمز عبور"
                    autocomplete="new-password" required>
                </div>
            </div>

            <div class="form-group">
                <label for="ppass2">تکرار رمز عبور</label>
                <div class="input-box">
                    <span class="input-icon">🔑</span>
                    <input type="password" name="ppass2" id="ppass2"
                    placeholder="تکرار رمز عبور"
                    autocomplete="new-password" required>
                </div>
            </div>

        </div>

        <button type="submit" name="psubmit"
        id="psubmit" class="signup-btn">
            ثبت نام و شروع 🚀
        </button>

    </form>

    <div class="footer">
        ساخته شده با <span>♥</span> برای شما
    </div>

</div>

</body>
</html>

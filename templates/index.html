
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحه اصلی</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Tahoma, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    padding: 20px;

    background: linear-gradient(
        135deg,
        #ff8fab,
        #c8a2ff,
        #8bd3ff,
        #8debc5
    );

    background-size: 300% 300%;
    animation: gradient 12s ease infinite;
}

@keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* اشکال تزئینی */

.circle {
    position: absolute;
    border-radius: 50%;
    opacity: .35;
    animation: float 7s ease-in-out infinite;
    pointer-events: none;
}

.circle.one {
    width: 220px;
    height: 220px;
    background: white;
    top: -70px;
    right: -50px;
}

.circle.two {
    width: 180px;
    height: 180px;
    background: #fff36b;
    bottom: -50px;
    left: -40px;
    animation-delay: 2s;
}

.circle.three {
    width: 75px;
    height: 75px;
    background: white;
    top: 18%;
    left: 15%;
    animation-delay: 1s;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-25px); }
}

/* کارت اصلی */

.container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 430px;
    padding: 45px 35px;
    border-radius: 30px;
    background: white;
    text-align: center;

    box-shadow: 0 25px 70px rgba(83,45,130,.22);
    border: 1px solid rgba(255,255,255,.8);
}

/* لوگو */

.logo {
    width: 90px;
    height: 90px;
    margin: 0 auto 22px;
    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 28px;
    font-size: 45px;

    background: linear-gradient(135deg,#ff80ab,#a78bfa);
    box-shadow: 0 12px 25px rgba(167,139,250,.35);

    transform: rotate(-5deg);
}

/* عنوان */

h1 {
    font-size: 26px;
    font-weight: bold;
    color: #39275f;
    margin-bottom: 12px;
}

.subtitle {
    font-size: 13px;
    color: #9990b1;
    line-height: 2;
    margin-bottom: 32px;
}

/* دکمه ها */

.menu-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;

    width: 100%;
    height: 60px;
    margin-bottom: 17px;

    border-radius: 16px;
    text-decoration: none;

    font-family: Tahoma, sans-serif;
    font-size: 16px;
    font-weight: bold;

    transition: .3s;
}

.login {
    color: white;
    background: linear-gradient(100deg,#ff75a0,#a178f5);
    box-shadow: 0 10px 22px rgba(177,116,226,.3);
}

.signup {
    color: #7954c5;
    background: #f5f0ff;
    border: 2px solid #e9ddff;
}

.menu-link:hover {
    transform: translateY(-5px);
}

.login:hover {
    box-shadow: 0 15px 28px rgba(177,116,226,.4);
}

.signup:hover {
    background: #eee5ff;
    border-color: #c8a2ff;
}

.menu-link:active {
    transform: scale(.97);
}

.menu-icon {
    font-size: 22px;
}

/* پایین کارت */

.footer {
    margin-top: 25px;
    font-size: 11px;
    color: #aaa2bd;
}

.footer span {
    color: #ff75a0;
}

/* موبایل */

@media(max-width:480px) {
    .container {
        padding: 35px 23px;
        border-radius: 25px;
    }

    h1 {
        font-size: 23px;
    }
}

@media(prefers-reduced-motion:reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="circle one"></div>
<div class="circle two"></div>
<div class="circle three"></div>

<div class="container">

    <div class="logo">🌈</div>

    <h1>به سامانه خوش آمدید! ✨</h1>

    <p class="subtitle">
        برای شروع، یکی از گزینه‌های زیر را انتخاب کنید
    </p>

    <a href="/login" class="menu-link login">
        <span class="menu-icon">🔐</span>
        ورود به حساب کاربری
    </a>

    <a href="/signup" class="menu-link signup">
        <span class="menu-icon">✨</span>
        ایجاد حساب کاربری
    </a>

    <div class="footer">
        ساخته شده با <span>♥</span> برای شما
    </div>

</div>

</body>
</html>

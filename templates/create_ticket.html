
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ثبت تیکت جدید</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Tahoma, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
    background: linear-gradient(135deg,#ff8fab,#c8a2ff,#8bd3ff,#8debc5);
    background-size: 300% 300%;
    animation: gradient 12s ease infinite;
}

@keyframes gradient {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* اشکال تزئینی */

.circle {
    position: fixed;
    border-radius: 50%;
    opacity: .3;
    pointer-events: none;
}

.one {
    width: 180px;
    height: 180px;
    background: white;
    top: -60px;
    right: -40px;
}

.two {
    width: 150px;
    height: 150px;
    background: #fff36b;
    bottom: -50px;
    left: -40px;
}

/* کارت اصلی */

.container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 470px;
    padding: 25px 28px;
    border-radius: 24px;
    background: white;
    text-align: center;
    box-shadow: 0 18px 55px rgba(83,45,130,.2);
}

/* لوگو */

.logo {
    width: 58px;
    height: 58px;
    margin: 0 auto 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 19px;
    font-size: 29px;
    background: linear-gradient(135deg,#ff80ab,#a78bfa);
    box-shadow: 0 7px 18px rgba(167,139,250,.3);
}

h1 {
    font-size: 21px;
    color: #39275f;
    margin-bottom: 7px;
}

.subtitle {
    font-size: 11px;
    color: #9990b1;
    margin-bottom: 17px;
}

/* نام کاربری */

.user-info {
    display: block;
    padding: 11px 13px;
    margin-bottom: 17px;
    border-radius: 11px;
    background: linear-gradient(100deg,#fff0f5,#f2edff);
    border-right: 5px solid #ff80ab;
    color: #654a93;
    font-size: 12px;
    text-align: right;
    line-height: 1.8;
}

.user-info strong {
    color: #a34db4;
}

/* فرم */

.form-group {
    margin-bottom: 13px;
    text-align: right;
}

label {
    display: block;
    color: #554875;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 6px;
}

.input-box {
    position: relative;
}

.input-box input,
.input-box select,
.input-box textarea {
    width: 100%;
    border: 1.5px solid #f0ecfa;
    border-radius: 11px;
    background: #faf9ff;
    color: #45366b;
    font-family: Tahoma,sans-serif;
    font-size: 12px;
    outline: none;
    transition: .25s;
    direction: rtl;
}

.input-box input,
.input-box select {
    height: 40px;
    padding: 0 36px 0 10px;
}

.input-box textarea {
    height: 105px;
    padding: 12px;
    resize: vertical;
    line-height: 1.8;
}

.input-box input:focus,
.input-box select:focus,
.input-box textarea:focus {
    background: white;
    border-color: #a78bfa;
    box-shadow: 0 0 0 3px rgba(167,139,250,.12);
}

.input-box input::placeholder,
.input-box textarea::placeholder {
    color: #b9b1cb;
}

.input-icon {
    position: absolute;
    right: 11px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    pointer-events: none;
}

.textarea-icon {
    position: absolute;
    top: 12px;
    right: 11px;
    font-size: 15px;
    pointer-events: none;
}

.input-box textarea {
    padding-right: 38px;
}

/* انتخاب فایل */

.file-box {
    background: #faf8ff;
    border: 1.5px dashed #c9b5f4;
    border-radius: 12px;
    padding: 10px;
    text-align: right;
    margin-top: 12px;
    margin-bottom: 15px;
}

.file-box label {
    font-size: 11px;
    color: #7954c5;
    margin-bottom: 8px;
}

.file-box input {
    width: 100%;
    font-family: Tahoma,sans-serif;
    font-size: 10px;
    color: #75658f;
}

/* دکمه */

.submit-btn {
    width: 100%;
    height: 45px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(100deg,#ff75a0,#a178f5);
    color: white;
    font-family: Tahoma,sans-serif;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(177,116,226,.3);
    transition: .3s;
}

.submit-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 22px rgba(177,116,226,.4);
}

.submit-btn:active {
    transform: scale(.97);
}

.footer {
    margin-top: 15px;
    font-size: 10px;
    color: #aaa2bd;
}

.footer span {
    color: #ff75a0;
}

/* موبایل */

@media(max-width:480px) {
    .container {
        padding: 22px 18px;
    }

    h1 {
        font-size: 19px;
    }
}

@media(prefers-reduced-motion:reduce) {
    *,*::before,*::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="circle one"></div>
<div class="circle two"></div>

<div class="container">

    <div class="logo">🎫</div>

    <h1>ثبت تیکت جدید ✨</h1>

    <p class="subtitle">
        پیام خود را ثبت کنید تا کارشناسان به آن رسیدگی کنند
    </p>

    <form method="post"
          enctype="multipart/form-data"
          action="/user/{{username}}/add_ticket">

        <input type="hidden" name="pname" value="{{username}}">
        <input type="hidden" name="pname" id="pname" value="#namefamily">
        <input type="hidden" name="pemail" id="pemail" value="#email">

        <div class="user-info">
            👤 در حال ثبت تیکت با نام کاربری:
            <strong>{{username}}</strong>
        </div>

        <div class="form-group">
            <label for="ptitle">📝 عنوان تیکت</label>
            <div class="input-box">
                <span class="input-icon">✏️</span>
                <input type="text" name="ptitle" id="ptitle"
                placeholder="عنوان درخواست خود را وارد کنید"
                required>
            </div>
        </div>

        <div class="form-group">
            <label for="preceiver">🏢 واحد دریافت کننده</label>
            <div class="input-box">
                <span class="input-icon">👨‍💼</span>
                <select name="preceiver" id="preceiver" required>
                    <option value="">واحد دریافت کننده را انتخاب کنید</option>
                    {% for expert_name in experts_name %}
                    <option value="{{expert_name[0]}}">
                        {{expert_name[0]}}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="pmessage">💬 متن پیام</label>
            <div class="input-box">
                <span class="textarea-icon">✍️</span>
                <textarea name="pmessage" id="pmessage"
                placeholder="شرح درخواست یا مشکل خود را اینجا بنویسید..."
                required></textarea>
            </div>
        </div>

        <div class="file-box">
            <label for="pfile">📎 پیوست فایل (اختیاری)</label>
            <input type="file" name="pfile" id="pfile"
            accept=".pdf,image/png,image/jpeg">
        </div>

        <button type="submit" name="psubmit"
        id="psubmit" class="submit-btn">
            ارسال تیکت 🚀
        </button>

    </form>

    <div class="footer">
        ساخته شده با <span>♥</span> برای شما
    </div>

</div>

</body>
</html>

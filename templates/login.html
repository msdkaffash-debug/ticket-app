
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود به سامانه</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Tahoma, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    padding: 20px;

    background: linear-gradient(
        135deg,
        #ff8fab,
        #c8a2ff,
        #8bd3ff,
        #8debc5
    );

    background-size: 300% 300%;
    animation: gradient 12s ease infinite;
}

@keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* اشکال تزئینی */

.circle {
    position: absolute;
    border-radius: 50%;
    opacity: .35;
    animation: float 7s ease-in-out infinite;
    pointer-events: none;
}

.circle.one {
    width: 220px;
    height: 220px;
    background: white;
    top: -70px;
    right: -50px;
}

.circle.two {
    width: 180px;
    height: 180px;
    background: #fff36b;
    bottom: -50px;
    left: -40px;
    animation-delay: 2s;
}

.circle.three {
    width: 75px;
    height: 75px;
    background: white;
    top: 18%;
    left: 15%;
    animation-delay: 1s;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-25px); }
}

/* کارت ورود */

.container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 410px;
    padding: 42px 35px;
    border-radius: 30px;
    background: #fff;
    text-align: center;

    box-shadow: 0 25px 70px rgba(83,45,130,.22);
    border: 1px solid rgba(255,255,255,.8);
}

/* لوگو */

.logo {
    width: 85px;
    height: 85px;
    margin: 0 auto 22px;
    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 27px;
    font-size: 42px;

    background: linear-gradient(135deg,#ff80ab,#a78bfa);
    box-shadow: 0 12px 25px rgba(167,139,250,.35);

    transform: rotate(-5deg);
}

/* عنوان */

h2 {
    font-size: 26px;
    font-weight: bold;
    color: #39275f;
    margin-bottom: 12px;
}

.subtitle {
    font-size: 13px;
    color: #9990b1;
    line-height: 2;
    margin-bottom: 30px;
}

/* فیلدها */

.form-group {
    margin-bottom: 20px;
    text-align: right;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    color: #554875;
    margin-bottom: 10px;
}

.input-box {
    position: relative;
}

.input-box input {
    width: 100%;
    height: 56px;
    padding: 0 48px 0 15px;

    border: 2px solid #f0ecfa;
    border-radius: 15px;

    background: #faf9ff;
    color: #45366b;

    font-family: Tahoma, sans-serif;
    font-size: 13px;

    outline: none;
    direction: rtl;
    transition: .3s;
}

.input-box input:focus {
    background: white;
    border-color: #a78bfa;
    box-shadow: 0 0 0 4px rgba(167,139,250,.13);
}

.input-box input::placeholder {
    color: #b9b1cb;
}

.input-icon {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 19px;
    pointer-events: none;
}

/* دکمه ورود */

.login-btn {
    width: 100%;
    height: 58px;
    margin-top: 12px;

    border: none;
    border-radius: 16px;

    background: linear-gradient(100deg,#ff75a0,#a178f5);

    color: white;
    font-family: Tahoma, sans-serif;
    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
    box-shadow: 0 10px 22px rgba(177,116,226,.3);
    transition: .3s;
}

.login-btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 15px 28px rgba(177,116,226,.4);
    filter: saturate(1.2);
}

.login-btn:active {
    transform: scale(.97);
}

/* پایین کارت */

.footer {
    margin-top: 27px;
    font-size: 11px;
    color: #aaa2bd;
}

.footer span {
    color: #ff75a0;
}

/* موبایل */

@media(max-width:480px) {
    .container {
        padding: 35px 23px;
        border-radius: 25px;
    }

    h2 {
        font-size: 23px;
    }
}

/* کاهش انیمیشن برای کاربران حساس */

@media(prefers-reduced-motion:reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="circle one"></div>
<div class="circle two"></div>
<div class="circle three"></div>

<div class="container">

    <div class="logo">🌈</div>

    <h2>خوش اومدی! ✨</h2>

    <p class="subtitle">
        برای ورود به سامانه، اطلاعات خودت رو وارد کن
    </p>

    <form action="/login_check" method="POST">

        <div class="form-group">
            <label for="pusername">نام کاربری 👤</label>

            <div class="input-box">
                <span class="input-icon">💌</span>
                <input
                    type="text"
                    name="pusername"
                    id="pusername"
                    placeholder="نام کاربری خودت رو بنویس"
                    autocomplete="username"
                    required
                >
            </div>
        </div>

        <div class="form-group">
            <label for="ppass">رمز عبور 🔐</label>

            <div class="input-box">
                <span class="input-icon">🔑</span>
                <input
                    type="password"
                    name="ppass"
                    id="ppass"
                    placeholder="رمز عبورت رو وارد کن"
                    autocomplete="current-password"
                    required
                >
            </div>
        </div>

        <button type="submit" name="psubmit" class="login-btn">
            ورود به سامانه 🚀
        </button>

    </form>

    <div class="footer">
        ساخته شده با <span>♥</span> برای شما
    </div>

</div>

</body>
</html>
